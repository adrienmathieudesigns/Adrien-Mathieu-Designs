<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>
/* Body */
body { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh; 
    background: #111; 
    margin: 0; 
    color: white; 
    font-family: initial;

    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

body.loaded {
    opacity: 1;
    transform: translateY(0);
}

body.locked {
    overflow: hidden;
}

/* Rotate Overlay */
#rotate-overlay {
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 22px;
    z-index: 9999;
    padding: 20px;
}

/* Hide overlay in landscape or desktop */
@media screen and (orientation: landscape),
screen and (min-width: 768px) {
    #rotate-overlay {
        display: none;
    }
}

/* Links */
a {
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
}

a:hover {
    text-decoration: underline;
}

/* Header */
#header {
    position: fixed;
    inset: 0; /* fills entire screen */
    display: flex;
    flex-direction: column;
    justify-content: center; /* vertical center */
    align-items: center;     /* horizontal center */
    text-align: center;
    background: #111;
    z-index: 1000;
}

#one {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 10px;
}

.nav-links {
    display: flex;
    gap: 20px;
}

/* Main */
#main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Quotes */
.quote-container {
    position: relative;
    max-width: 600px;
    margin: 40px auto;
    text-align: center;
}

.quote {
    position: absolute;
    width: 100%;
    opacity: 0;
    transition: opacity 0.6s ease;
    line-height: 1.6;
    font-size: 16px;
}

.quote.active {
    opacity: 1;
    position: relative;
}

.quote-author {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.8;
}

/* Footer */
footer {
    margin-top: auto;
    text-align: center;
    padding: 20px 0;
}
</style>
</head>

<body>

<!-- Rotate Overlay -->
<div id="rotate-overlay">
    <div>
        <p>Please rotate your device</p>
        <p style="font-size:14px; opacity:0.7;">
            This site is best viewed in landscape mode
        </p>
    </div>
</div>

<!-- Header -->
<div id="header">
    <div id="one">ADRIEN MATHIEU DESIGNS</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="Lighting.html">Lighting</a>
        <a href="Video.html">Video</a>
        <a href="Art.html">Art</a>
        <a href="About.html">About</a>
    </div>
</div>
        <a href="Lighting.html">ENTER</a>
<div id="main-content">

</div>

<script>
const quotes = document.querySelectorAll("#quotes .quote");
let index = 0;

function nextQuote() {
    quotes.forEach(q => q.classList.remove("active"));
    index = (index + 1) % quotes.length;
    quotes[index].classList.add("active");
}

setInterval(nextQuote, 8000);

/* Fade-in */
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
    checkOrientation();
});

/* Orientation Check */
function checkOrientation() {
    const overlay = document.getElementById("rotate-overlay");

    if (window.innerHeight > window.innerWidth && window.innerWidth < 768) {
        overlay.style.display = "flex";
        document.body.classList.add("locked");
    } else {
        overlay.style.display = "none";
        document.body.classList.remove("locked");
    }
}

window.addEventListener("resize", checkOrientation);
</script>

<footer>
    <small>&copy;2026 - Adrien Mathieu</small>
</footer>

</body>
</html>
