<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>
/* Body */
body { 
    margin: 0; 
    color: white; 
    font-family: initial;
    overflow: hidden;

    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

body.loaded {
    opacity: 1;
    transform: translateY(0);
}

body.locked {
    overflow: hidden;
}

/* ================= BACKGROUND SLIDES ================= */
#background {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.bg-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.bg-slide.active {
    opacity: 1;
}

/* ================= ROTATE OVERLAY ================= */
#rotate-overlay {
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 22px;
    z-index: 9999;
    padding: 20px;
}

@media screen and (orientation: landscape),
screen and (min-width: 768px) {
    #rotate-overlay {
        display: none;
    }
}

/* ================= LINKS ================= */
a {
    color: white;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

/* ================= HEADER (CENTERED OVERLAY) ================= */
#header {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.3); /* subtle overlay for readability */
    backdrop-filter: blur(4px);
    z-index: 10;
    text-align: center;
}

#one {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 15px;
}

.nav-links {
    display: flex;
    gap: 20px;
}

/* ================= FOOTER ================= */
footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    z-index: 20;
    font-size: 12px;
    opacity: 0.8;
}
</style>
</head>

<body>

<!-- BACKGROUND IMAGES -->
<div id="background">
    <div class="bg-slide active" style="background-image: url('LU1.jpg');"></div>
    <div class="bg-slide" style="background-image: url('GT10.jpg');"></div>
    <div class="bg-slide" style="background-image: url('DW1.jpg');"></div>
    <div class="bg-slide" style="background-image: url('HD4.jpg');"></div>
</div>

<!-- Rotate Overlay -->
<div id="rotate-overlay">
    <div>
        <p>Please rotate your device</p>
        <p style="font-size:14px; opacity:0.7;">
            This site is best viewed in landscape mode
        </p>
    </div>
</div>

<!-- Header -->
<div id="header">
    <div id="one">ADRIEN MATHIEU DESIGNS</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="Lighting.html">Lighting</a>
        <a href="Video.html">Video</a>
        <a href="Art.html">Art</a>
        <a href="About.html">About</a>
    </div>
</div>

<script>
/* ================= BACKGROUND FADE ================= */
const slides = document.querySelectorAll(".bg-slide");
let current = 0;

function nextBackground() {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
}

setInterval(nextBackground, 6000);

/* ================= FADE-IN ================= */
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
    checkOrientation();
});

/* ================= ORIENTATION CHECK ================= */
function checkOrientation() {
    const overlay = document.getElementById("rotate-overlay");

    if (window.innerHeight > window.innerWidth && window.innerWidth < 768) {
        overlay.style.display = "flex";
        document.body.classList.add("locked");
    } else {
        overlay.style.display = "none";
        document.body.classList.remove("locked");
    }
}

window.addEventListener("resize", checkOrientation);
</script>

<footer>
    <small>&copy;2026 - Adrien Mathieu</small>
</footer>

</body>
</html>
