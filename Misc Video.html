<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Misc Video</title>

<style>
body { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh; 
    background: #111; 
    margin: 0; 
    color: white; 
    font-family: Arial, sans-serif;
}

/* Header */
#header {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 1000;
}

#one {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 10px;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: white;
    text-decoration: none;
}

.nav-links a:hover {
    text-decoration: underline;
}

/* Main */
#main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Media container */
.media-container {
    width: 1000px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    margin-top: 20px;
}

/* VIDEO WRAPPER */
.video-wrapper {
    position: relative;
    width: 100%;
}

.video-wrapper video {
    width: 100%;
    max-height: 700px;
    object-fit: contain;
    background: black;
    display: block;
}

/* CENTER PLAY BUTTON */
.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    cursor: pointer;
}

.play-button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-40%, -50%);
    border-left: 25px solid white;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
}

/* HIDE BUTTON WHEN PLAYING */
.video-wrapper.playing .play-button {
    opacity: 0;
    pointer-events: none;
}

/* Description */
.description-credits {
    display: flex;
    gap: 60px;
    margin-top: 0px;
    max-width: 900px;
}

.title {
    font-size: 26px;
    font-weight: bold;
}

.subtext {
    font-size: 14px;
    opacity: 0.8;
}

/* Footer */
footer {
    margin-top: auto;
    text-align: center;
    padding: 20px 0;
}

/* Responsive */
@media (max-width: 1024px) {
    .media-container {
        width: 90%;
    }

    .description-credits {
        flex-direction: column;
        gap: 20px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<div id="header">
    <div id="one">ADRIEN MATHIEU DESIGNS</div>
    <div class="nav-links">
        <a href="Home.html">Home</a>
        <a href="Lighting.html">Lighting</a>
        <a href="Video.html">Video</a>
        <a href="Art.html">Art</a>
        <a href="About.html">About</a>
    </div>
</div>

<div id="main-content">

<h1>VIDEO</h1>

<div class="media-container">

    <!-- VIDEO 1 -->
    <div class="video-wrapper">
        <video preload="metadata">
            <source src="Dream Sequence.mp4" type="video/mp4">
        </video>
        <div class="play-button"></div>
    </div>

    <div class="description-credits">
        <div class="description">
            <p class="title">Dream Sequence (2025)</p>
            <p class="subtext">Music And Video By Adrien Mathieu</p>
        </div>
    </div>

    <!-- VIDEO 2 -->
    <div class="video-wrapper">
        <video preload="metadata">
            <source src="Dream Sequence.mp4" type="video/mp4">
        </video>
        <div class="play-button"></div>
    </div>

    <div class="description-credits">
        <div class="description">
            <p class="title">Left Unheard By Perse Grammar (2025)</p>
            <p class="subtext">The Theater School At DePaul University</p>
        </div>
    </div>

</div>

</div>

<!-- Script -->
<script>
const wrappers = document.querySelectorAll(".video-wrapper");

wrappers.forEach(wrapper => {
    const video = wrapper.querySelector("video");
    const button = wrapper.querySelector(".play-button");

    function pauseAllOthers() {
        document.querySelectorAll("video").forEach(v => {
            if (v !== video) {
                v.pause();
                v.parentElement.classList.remove("playing");
            }
        });
    }

    function togglePlay() {
        if (video.paused) {
            pauseAllOthers();
            video.play();
            wrapper.classList.add("playing");
        } else {
            video.pause();
            wrapper.classList.remove("playing");
        }
    }

    button.addEventListener("click", togglePlay);
    video.addEventListener("click", togglePlay);

    video.addEventListener("play", () => {
        pauseAllOthers();
        wrapper.classList.add("playing");
    });

    video.addEventListener("pause", () => {
        wrapper.classList.remove("playing");
    });
});
</script>

<!-- Footer -->
<footer>
    <small>&copy;2026 - Adrien Mathieu</small>
</footer>

</body>
</html>
