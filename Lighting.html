<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lighting Design</title>
    <link rel="stylesheet" href="A.M.D.Style.css">

    <style>
        /* ---------- Body ---------- */
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background: #111; 
            margin: 0; 
            color: white; 
            font-family: initial;
        
            /* Fade setup */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        /* When loaded */
        body.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- Header (HOME page style) ---------- */
        #header {
            width: 100%;
            font-family: initial;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            background: #111;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        #one {
            font-size: 40px;
            font-weight: bold;
            margin: 0 0 10px 0;
            text-align: center;
            color: white;
        }

        #two {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* ---------- Image Hover Effect ---------- */
        .image-container {
            position: relative;
            display: inline-block;
            margin: 10px;
        }

        .image-container img {
            display: block;
            width: 400px;
            height: 290px;
            transition: 0.4s ease;
        }

        .image-container .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .image-container:hover img {
            filter: blur(5px);
        }

        .image-container:hover .overlay {
            opacity: 1;
        }

        /* ---------- Center Gallery ---------- */
        #gallery {
            text-align: center;
        }

        #gallery small {
            display: block;
            margin-bottom: 20px;
        }

        /* ---------- Main Heading ---------- */
        h1 {
            color: white;
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            margin-top: 50px;
            color: white;
        }
    </style>
</head>

    <script>
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});
</script>

        <div id="gallery">

            </div>

            </div>

            <div class="image-container">
                <a href="AddamsFamily.html">

                </a>
            </div>
            
            <div class="image-container">

                </a>

    <!-- Footer -->
    <footer>

</body>
</html>
