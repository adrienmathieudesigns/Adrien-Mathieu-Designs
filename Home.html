<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HOME</title>

<style>
/* Body */
body { 
    display: flex; 
    flex-direction: column; 
    min-height: 100vh; 
    background: #111; 
    margin: 0; 
    color: white; 
    font-family: Arial, sans-serif;
}

/* All links site-wide */
a {
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
}

a:hover {
    text-decoration: underline;
}

/* Header */
#header {
    width: 100%;
    font-family:initial;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 1000;
}

/* Title */
#one {
    font-size: 40px;
    font-weight: bold;
    margin: 0 0 10px 0;
    text-align: center;
}

/* Nav container */
#two {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Nav Links spacing */
.nav-links {
    display: flex;
    gap: 20px;
    justify-content: center;
}

/* Main content */
#main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* Slider */
.slider { 
    position: relative; 
    width: 1000px; 
    height: 700px; 
    overflow: hidden; 
    margin-top: 20px;
} 

.slides { 
    display: flex; 
    width: 100%; 
    height: 100%; 
    transition: transform 0.6s ease-in-out; 
} 

.slide {
    flex: 0 0 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
}

.slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Arrows */
.arrow { 
    position: absolute; 
    top: 50%; 
    transform: translateY(-50%); 
    font-size: 30px; 
    background: rgba(0,0,0,0.5); 
    color: white; 
    border: none; 
    cursor: pointer; 
    padding: 10px; 
    z-index: 10;
}

.left { left: 10px; } 
.right { right: 10px; } 

/* Footer */
footer {
    margin-top: auto;
    text-align: center;
    padding: 20px 0;
}

/* Responsive */
@media (max-width: 1024px) {
    .slider {
        width: 90%;
        height: auto;
    }
}
</style>

</head>

<body>

<!-- Header -->
<div id="header">
    <div id="one">ADRIEN MATHIEU DESIGNS</div>

    <div id="two">
        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="Lighting.html">Lighting</a>
            <a href="Video.html">Video</a>
            <a href="Art.html">Art</a>
            <a href="About.html">About</a>
        </div>
    </div>
</div>

<div id="main-content">

<!-- Slider -->
<div class="slider"> 
    <button class="arrow left" onclick="prevSlide()">❮</button>

    <div class="slides" id="slides"> 
        <div class="slide"><a href="LeftUnheard.html"><img src="LU1.jpg"></a></div>
        <div class="slide"><a href="Grimm Tales.html"><img src="GT10.jpg"></a></div>
        <div class="slide"><a href="DanceWest.html"><img src="DW1.jpg"></a></div>
        <div class="slide"><a href="Hurricane Diane-SK-167.jpg"><img src="HD4.jpg"></a></div>
        <div class="slide"><a href="AddamsFamily.html"><img src="AF1.jpg"></a></div>
        <div class="slide"><a href="Cabaret.html"><img src="C2.jpg"></a></div>
    </div>

    <button class="arrow right" onclick="nextSlide()">❯</button>
</div>

</div>

<!-- Slider Script -->
<script>
let index = 0;
const slides = document.getElementById("slides");
const totalSlides = slides.children.length;
let slideInterval;

function updateSlide() {
    slides.style.transform = "translateX(" + (-index * 100) + "%)";
}

function nextSlide() {
    index = (index + 1) % totalSlides;
    updateSlide();
    resetInterval();
}

function prevSlide() {
    index = (index - 1 + totalSlides) % totalSlides;
    updateSlide();
    resetInterval();
}

function startInterval() {
    slideInterval = setInterval(nextSlide, 10000);
}

function resetInterval() {
    clearInterval(slideInterval);
    startInterval();
}

startInterval();
</script>

<!-- Footer -->
<footer>
    <small>&copy;2026 - Adrien Mathieu</small>
</footer>

</body>
</html>
